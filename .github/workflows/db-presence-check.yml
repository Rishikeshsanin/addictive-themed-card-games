name: Disposable DB presence validation

on:
  pull_request:
    paths:
      - 'tests/db-presence-*.mjs'
      - 'migrations/004_multiplayer_rooms.sql'
      - 'migrations/005_deckverse_rate_limits.sql'
      - 'migrations/006_deckverse_presence.sql'
      - 'api/game.js'
      - 'src/presence.js'
      - '.github/workflows/db-presence-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: deckverse_presence_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fictional-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deckverse_presence_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Enable TLS on disposable PostgreSQL only
        shell: bash
        run: |
          set -euo pipefail
          CID="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$CID"
          docker exec --user root "$CID" bash -ec '
            openssl req -new -newkey rsa:2048 -nodes -x509 -days 1 \
              -subj "/CN=localhost" \
              -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
              -keyout /var/lib/postgresql/data/server.key \
              -out /var/lib/postgresql/data/server.crt >/dev/null 2>&1
            chown postgres:postgres /var/lib/postgresql/data/server.key /var/lib/postgresql/data/server.crt
            chmod 0600 /var/lib/postgresql/data/server.key
          '
          docker exec "$CID" psql -U postgres -d deckverse_presence_ci -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec "$CID" psql -U postgres -d deckverse_presence_ci -v ON_ERROR_STOP=1 \
            -c 'SELECT pg_reload_conf()'
          for i in $(seq 1 20); do
            VALUE="$(docker exec "$CID" psql -U postgres -d deckverse_presence_ci -At -c 'SHOW ssl')"
            if [ "$VALUE" = on ]; then break; fi
            sleep 1
          done
          test "$VALUE" = on
          docker cp "$CID":/var/lib/postgresql/data/server.crt "$RUNNER_TEMP/deckverse-ci-cert.crt"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/deckverse-ci-cert.crt" >> "$GITHUB_ENV"
      - name: PostgreSQL migration and real-API presence scenarios
        env:
          PRESENCE_TEST_DISPOSABLE: 'yes'
          PRESENCE_TEST_ADMIN_URL: postgres://postgres:fictional-local-only@127.0.0.1:5432/deckverse_presence_ci
          DECKVERSE_DATABASE_URL: postgres://deckverse_app:fictional-disposable-only@127.0.0.1:5432/deckverse_presence_ci
        run: node --test tests/db-presence-check.mjs
