name: DeckVerse CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate syntax
        run: |
          node --check src/catalog.js
          node --check src/engine.js
          node --check src/app.js
          node --check api/game.js
          node --check api/livekit-token.js
      - name: Test rules and invariants
        run: npm test
      - name: Audit deck comparisons
        run: npm run balance

      - name: Simulate 2000 complete classic matches
        run: npm run simulate
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/deckverse-http.log 2>&1 &
          sleep 1
      - name: Real Chrome desktop/mobile UI smoke
        run: npm run test:ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Two-player production API integration (isolated test room)
        if: github.event_name == 'push'
        run: node tests/live-multiplayer.mjs
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deckverse-browser-screenshots
          path: /tmp/deckverse-*.png
          if-no-files-found: ignore
