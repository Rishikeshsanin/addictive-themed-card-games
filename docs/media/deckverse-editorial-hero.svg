</g>
<text x="92" y="604" fill="#b3b0ca" font-size="20" font-family="Arial,sans-serif" letter-spacing=".2">Thirteen universes. Eight ways to win.</text>
<text x="92" y="637" fill="#b3b0ca" font-size="20" font-family="Arial,sans-serif">One timeless card-battle feeling.</text>
