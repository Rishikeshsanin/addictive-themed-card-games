<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="t d">
<title id="t">DeckVerse — old-school rivalry, new-school magic: original brand concept</title>
<desc id="d">Illustrated DeckVerse showcase art with three abstract collectible card silhouettes in neon lime, iris purple and midnight indigo. This is original branding artwork, not a gameplay screenshot.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070813"/><stop offset=".55" stop-color="#10112c"/><stop offset="1" stop-color="#080713"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#7444ed" stop-opacity=".55"/><stop offset="1" stop-color="#7444ed" stop-opacity="0"/></radialGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4ff5b"/><stop offset=".57" stop-color="#8cff63"/><stop offset="1" stop-color="#6afbc8"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bc8fff"/><stop offset="1" stop-color="#6436cb"/></linearGradient>
 <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#24254d"/><stop offset="1" stop-color="#101122"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9b91b9" stroke-opacity=".13" stroke-width="1"/></pattern>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="23"/></filter>
