<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">DeckVerse — Pick your universe. Own the round.</title><desc id="desc">Original purple and lime editorial gaming banner with playing-card motifs for the DeckVerse project.</desc>
